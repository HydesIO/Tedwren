<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tedwren</title>
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/dialogs.css" rel="stylesheet" />
    <link href="Tedwren.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-splash">
            <img class="loading-splash__logo" src="images/logo-icon.svg" alt="" />
            <span class="loading-splash__label">Loading Tedwren…</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/tedwren.js"></script>
    <script>
        // Triggers a client-side file download (e.g. CSV export) without a round-trip to the server.
        window.tedwrenDownload = (fileName, mimeType, content) => {
            const blob = new Blob([content], { type: mimeType || 'text/plain' });
            downloadBlob(fileName, blob);
        };

        // Downloads binary content supplied as base64 (e.g. a pack ZIP or PDF).
        window.tedwrenDownloadBase64 = (fileName, mimeType, base64) => {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            downloadBlob(fileName, new Blob([bytes], { type: mimeType || 'application/octet-stream' }));
        };

        function downloadBlob(fileName, blob) {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
